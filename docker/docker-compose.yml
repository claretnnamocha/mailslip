services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailslip
      POSTGRES_PASSWORD: mailslip
      POSTGRES_DB: mailslip
    ports:
      - "5432:5432"
    volumes:
      - mailslip_pg:/var/lib/postgresql/data
      - ./postgres/init-zitadel.sql:/docker-entrypoint-initdb.d/01-zitadel.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailslip -d mailslip"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Zitadel identity provider (OIDC).
  # After first boot, create a Web/CODE app in the console and set
  # ZITADEL_CLIENT_ID / ZITADEL_CLIENT_SECRET in the project .env, then
  # restart the app service: npm run docker:up
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    restart: unless-stopped
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: mailslip
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: mailslip
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: mailslip
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: mailslip
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALPORT: 9090
      ZITADEL_EXTERNALDOMAIN: localhost
      # Use classic Login V1 (bundled). Login V2 is a separate app and returns
      # {"code":5,"message":"Not Found"} if that UI container is not deployed.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin@mailslip.local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Password1!
    ports:
      - "9090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js Mailslip app (API + UI)
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      # Override hostnames for in-network service discovery
      DATABASE_URL: postgresql://mailslip:mailslip@postgres:5432/mailslip?schema=public
      NEXTAUTH_URL: http://localhost:3000
      # Issuer must stay as localhost so the browser can reach Zitadel;
      # extra_hosts maps localhost inside this container to the host gateway.
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-http://localhost:9090}
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      zitadel:
        condition: service_started

volumes:
  mailslip_pg:
